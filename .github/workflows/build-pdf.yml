name: Build PDF

on:
    push:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Compile LaTeX to PDF
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            
            - name: Install LaTeX
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      latexmk \
                      texlive-latex-recommended \
                      texlive-latex-extra \
                      texlive-fonts-recommended

            - name: Compile PDF
              uses: |
                  latexmk \
                      -cd \
                      -pdf \
                      -interaction=nonstopmode \
                      -halt-on-error \
                      -file-line-error \
                      docs/report/report.tex \
                      docs/summary/summary.tex \
                      docs/report/presentation.tex
              with:
                  root_file: |
                    docs/report/report.tex
                    docs/summary/summary.tex
                    docs/report/presentation.tex

            - name: Upload PDF artifact
              uses: actions/upload-artifact@v7
              with:
                  name: pdf-${{ github.sha }}
                  path: |
                    docs/report/report.pdf
                    docs/summary/summary.pdf
                    docs/report/presentation.pdf
                  if-no-files-found: error
                  retention-days: 60
